<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камертон — практики</title>
<style>
  :root { --bg:#0f1115; --fg:#e8e6e3; --dim:#9a9a93; --accent:#e8862c; --ok:#4f9d69; --err:#c94f4f; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav button { flex: 1; padding: 10px; background: #1a1d24; color: var(--fg); border: 1px solid #2a2e37; border-radius: 8px; font-size: 15px; }
  nav button.on { border-color: var(--accent); color: var(--accent); }
  .screen { display: none; }
  .screen.on { display: block; }
  .card { background: #161920; border: 1px solid #2a2e37; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .circle { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3a4152, #22262f); margin: 24px auto; }
  .lbl { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button.act { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #14100b; font-size: 15px; }
  button.act.sec { background: #2a2e37; color: var(--fg); }
  #status { font-size: 13px; color: var(--dim); min-height: 20px; margin-top: 8px; white-space: pre-wrap; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<h1>Камертон</h1>
<nav>
  <button id="tab-pacer" class="on" onclick="show('pacer')">Пейсер</button>
  <button id="tab-ppg" onclick="show('ppg')">Пульс</button>
</nav>

<section id="screen-pacer" class="screen on">
  <div class="card">
    <div class="circle" id="pacer-circle"></div>
    <p class="lbl" id="pacer-phase">&nbsp;</p>
    <p class="lbl">Темп: <b id="pacer-tempo">5.5</b> вдохов/мин (диапазон 4.5–7.0, шаг 0.25)</p>
    <div class="row">
      <button class="act sec" onclick="tempoDown()">−</button>
      <button class="act sec" onclick="tempoUp()">+</button>
      <button class="act" id="pacer-step-btn" onclick="startStep()">Старт шага (2 мин)</button>
    </div>
    <p class="lbl" id="pacer-timer">&nbsp;</p>
    <p class="lbl"><label><input type="checkbox" id="ppg-during-step"> писать пульс во время шагов — RR-сегмент на каждый темп (Н2-06)</label></p>
  </div>
  <div class="card">
    <p class="lbl">Журнал сессии (таблица practice_session, SQLite)</p>
    <div class="row">
      <button class="act" onclick="openSession('pacer')">Начать сессию</button>
      <button class="act" onclick="openSession('sweep')">Начать протокол перебора</button>
      <button class="act sec" onclick="closeSession()">Завершить</button>
    </div>
    <p id="pacer-marks" class="lbl"></p>
  </div>
</section>

<section id="screen-ppg" class="screen">
  <div class="card">
    <video id="ppg-video" playsinline muted autoplay style="width:120px;height:120px;border-radius:50%;object-fit:cover;background:#22262f;display:block;margin:0 auto;"></video>
    <p class="lbl" id="ppg-hint">Палец на объектив камеры (или лицо в кадр). Кадры обрабатываются на устройстве и никуда не сохраняются — инвариант 7.</p>
    <p class="lbl" id="ppg-timer">&nbsp;</p>
    <div class="row">
      <button class="act" id="ppg-start-btn" onclick="ppgStart()">Старт записи</button>
      <button class="act sec" id="ppg-stop-btn" onclick="ppgStop()" disabled>Стоп</button>
      <button class="act sec" id="ppg-save-btn" onclick="ppgSave()" disabled>Сохранить RR в сессию</button>
    </div>
    <p class="lbl" id="ppg-summary">&nbsp;</p>
  </div>
</section>

<p id="status"></p>

<script>
"use strict";
// Канал ADR-0002 (вариант «а», приватный туннель): страница отдаётся
// маршрутом /miniapp программы Камертона; токен владельца передаётся в
// каждом запросе (параметр t из адреса страницы). Наружу страница не
// ходит: вся работа против того же origin, внешних ресурсов нет —
// инвариант 7 (данные не покидают машину владельца).
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var sessionId = 0;
var marks = [];

function show(name) {
  var names = ["pacer", "ppg"];
  for (var i = 0; i < names.length; i++) {
    document.getElementById("screen-" + names[i]).className = names[i] === name ? "screen on" : "screen";
    document.getElementById("tab-" + names[i]).className = names[i] === name ? "on" : "";
  }
}

function status(msg, cls) {
  var el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls || "";
}

function api(path, params) {
  var q = new URLSearchParams(params || {});
  q.set("t", TOKEN);
  return fetch(path + "?" + q.toString(), {
    method: "POST",
    headers: { "X-CSRF-Token": csrfToken() }
  })
    .then(function (r) {
      return r.text().then(function (body) { return { code: r.status, body: body }; });
    });
}

// CSRF-мидлварь сервера (double-submit): GET страницы выдаёт куку
// _mlog_csrf, каждый POST обязан нести её значение в X-CSRF-Token.
// TTL токена — 15 минут; истёкший/чужой токен отвечает 403 с «CSRF»
// в теле — перезагружаем страницу (GET перевыпустит куку). Отметки
// шагов пишутся инкрементально, поэтому перезагрузка теряет максимум
// текущий неотмеченный шаг.
function csrfToken() {
  var m = document.cookie.match(/(?:^|;\s*)_mlog_csrf=([^;]+)/);
  return m ? m[1] : "";
}

function openSession(kind) {
  api("/miniapp/session", { kind: kind, tempo_bpm: String(tempo), steps_total: String(STEPS_TOTAL), arm_id: "0", trial_id: "0" })
    .then(function (res) {
      if (res.code === 403 && res.body.indexOf("CSRF") >= 0) { location.reload(); return; }
      if (res.code !== 200) { status("Отказ сервера: " + res.code + " " + res.body, "err"); return; }
      var d = JSON.parse(res.body);
      sessionId = d.id;
      marks = [];
      document.getElementById("pacer-marks").textContent = "Сессия №" + sessionId + ", шагов: 0";
      status("Сессия " + sessionId + " открыта: протокол " + STEPS_TOTAL + " шагов по 2 минуты", "ok");
    })
    .catch(function (e) { status("Ошибка сети: " + e, "err"); });
}

// ── Пейсер (Н2-04) ──────────────────────────────────────────────────────
// Протокол концепции: перебор темпов 4.5–7.0 вдох/мин с шагом 0.25,
// по две минуты на темп; отметка завершения шага пишется в сессию
// инкрементально (писцы Н2-03). Чистая математика фазы вынесена в
// pacerState — её пиннет скрипт-проверка против эталонной раскадки
// (self-host/miniapp/test/pacer-test.mjs).
// PacerEngine-START (маркер скрипт-проверки: источник математики)
var TEMPO_MIN = 4.5;
var TEMPO_MAX = 7.0;
var TEMPO_STEP = 0.25;
var STEP_MS = 120000;   // две минуты на темп — протокол концепции
var STEPS_TOTAL = 11;   // (7.0 − 4.5) / 0.25 + 1

// Плавная синусоида: равные половины вдоха/выдоха, масштаб 0.10–1.00,
// старт из середины (0.55) на вдохе. Никакого накопления дрейфа: фаза
// всегда считается от времени старта шага, а не приращением.
function pacerState(tempoBpm, tMs) {
  var periodMs = 60000 / tempoBpm;
  var phase = (tMs % periodMs) / periodMs;
  var s = Math.sin(2 * Math.PI * phase);
  return {
    periodMs: periodMs,
    phase: phase,
    dir: phase < 0.5 ? "вдох" : "выдох",
    scale: 0.55 + 0.45 * s
  };
}
// PacerEngine-END

var tempo = 5.5;
var stepRunning = false;
var stepStart = 0;
var stepNo = 0;
var rafId = 0;

function tempoUp() {
  tempo = Math.min(TEMPO_MAX, Math.round((tempo + TEMPO_STEP) * 100) / 100);
  document.getElementById("pacer-tempo").textContent = tempo.toFixed(2);
}

function tempoDown() {
  tempo = Math.max(TEMPO_MIN, Math.round((tempo - TEMPO_STEP) * 100) / 100);
  document.getElementById("pacer-tempo").textContent = tempo.toFixed(2);
}

function startStep() {
  if (stepRunning) { return; }
  if (!sessionId) { status("Сначала начните сессию", "err"); return; }
  var wantPpg = document.getElementById("ppg-during-step").checked;
  if (wantPpg && ppgSampling) { status("Сначала остановите запись на вкладке «Пульс»", "err"); return; }
  stepRunning = true;
  stepNo = marks.length + 1;
  stepStart = performance.now();
  document.getElementById("pacer-step-btn").disabled = true;
  if (wantPpg) { sweepStepStart(); }
  paceFrame();
}

function paceFrame() {
  var t = performance.now() - stepStart;
  if (t >= STEP_MS) {
    finishStep();
    return;
  }
  var st = pacerState(tempo, t);
  document.getElementById("pacer-circle").style.transform = "scale(" + st.scale.toFixed(4) + ")";
  document.getElementById("pacer-phase").textContent = st.dir;
  var left = Math.ceil((STEP_MS - t) / 1000);
  document.getElementById("pacer-timer").textContent = "Шаг " + stepNo + " · осталось " + left + " с";
  rafId = requestAnimationFrame(paceFrame);
}

function finishStep() {
  stepRunning = false;
  cancelAnimationFrame(rafId);
  document.getElementById("pacer-circle").style.transform = "scale(0.55)";
  document.getElementById("pacer-phase").textContent = "\u00a0";
  document.getElementById("pacer-timer").textContent = "\u00a0";
  document.getElementById("pacer-step-btn").disabled = false;
  var rec = stepMark();
  api("/miniapp/session/close", {
    id: String(sessionId),
    steps_done: String(marks.length + 1),
    step_marks: JSON.stringify(marks.concat([rec])),
    rr_json: "",
    rr_source: ""
  })
    .then(function (res) {
      if (res.code === 403 && res.body.indexOf("CSRF") >= 0) { location.reload(); return; }
      if (res.code !== 200) { status("Отказ сервера: " + res.code + " " + res.body, "err"); return; }
      marks.push(rec);
      document.getElementById("pacer-marks").textContent = "Сессия №" + sessionId + ", шагов: " + marks.length + " · последний темп " + tempo.toFixed(2);
      if (rec.rr_reason !== "") {
        status("Шаг " + stepNo + " (темп " + tempo.toFixed(2) + ") записан, но пульс забракован: " + rec.rr_reason, "err");
      } else if (rec.rr.length) {
        status("Шаг " + stepNo + " (темп " + tempo.toFixed(2) + ") записан с RR (" + rec.rr.length + " интервалов) — смените темп и повторите", "ok");
      } else {
        status("Шаг " + stepNo + " (темп " + tempo.toFixed(2) + ") записан — смените темп и повторите", "ok");
      }
    })
    .catch(function (e) { status("Ошибка сети: " + e, "err"); });
}

function closeSession() {
  if (!sessionId) { status("Сессия не открыта", "err"); return; }
  api("/miniapp/session/close", {
    id: String(sessionId),
    steps_done: String(marks.length),
    step_marks: JSON.stringify(marks),
    rr_json: rrBuffer.length ? JSON.stringify(rrBuffer) : "",
    rr_source: rrBuffer.length ? "ppg" : "",
    final: "1"
  })
    .then(function (res) {
      if (res.code === 403 && res.body.indexOf("CSRF") >= 0) { location.reload(); return; }
      if (res.code !== 200) { status("Отказ сервера: " + res.code + " " + res.body, "err"); return; }
      var d = JSON.parse(res.body);
      if (d.sweep && d.sweep.ok) {
        var v = "";
        if (d.sweep.verdict === "reproducible") { v = " · повтор: воспроизведён"; }
        if (d.sweep.verdict === "divergent") { v = " · повтор: РАСХОЖДЕНИЕ"; }
        status("Протокол принят: резонанс " + d.sweep.resonance_bpm + " вдох/мин, доля мощности " + Math.round(d.sweep.share * 100) + "%" + v + " — зафиксировано в sweep_result", "ok");
      } else if (d.sweep) {
        status("Протокол не принят: " + d.sweep.reason, "err");
      } else {
        status("Сессия " + sessionId + " закрыта: шагов " + marks.length + (rrBuffer.length ? ", RR " + rrBuffer.length : ""), "ok");
      }
      sessionId = 0; marks = []; rrBuffer = []; stepSamples = [];
      sweepStopCam();
      document.getElementById("pacer-marks").textContent = "";
    })
    .catch(function (e) { status("Ошибка сети: " + e, "err"); });
}

// ── PPG через камеру → RR-интервалы (Н2-05) ─────────────────────────────
// Инвариант 7: кадры живут только в canvas на устройстве; наружу уходит
// ТОЛЬКО итоговый RR-ряд с метками качества, по явному действию
// владельца. Сырые кадры не сохраняются нигде — их некуда сохранять:
// страница не имеет хранилища, кроме сессионного журнала RR.
// PpgEngine-START (маркер скрипт-проверки: источник математики)
// Дискретизация сигнала: {t: мс, v: 0..255 — средний зелёный канал
// центральной области кадра}. Пайплайн: скользящая база (окно 1.5 с) →
// AC-составляющая → эпохи по 10 с → пики (локальные максимумы выше
// порога 0.6 амплитуды эпохи с рефрактерным окном 300 мс = верхний
// предел 200 уд/мин) → RR = межпиковые интервалы.
// Контроль качества эпохи: пиков ≥ 5; RR эпохи в [300, 2000] мс
// (30–200 уд/мин); CV = std/mean ≤ 0.25; амплитуда ≥ 6× шумовой пол
// (шум — медиана |Δv| соседних отсчётов). Отбракованные эпохи
// считаются; итоговый отказ громкий: эпох < 2, брак > 50% или RR < 8.
var PPG_EPOCH_MS = 10000;
var PPG_BASELINE_MS = 1500;
var PPG_REFRACTORY_MS = 300;
var PPG_RR_MIN = 300;
var PPG_RR_MAX = 2000;
var PPG_CV_MAX = 0.25;
var PPG_AMPL_NOISE_X = 6.0;

function ppgExtractRR(samples) {
  var n = samples.length;
  if (n < 2) {
    return { rr: [], epochsTotal: 0, epochsRejected: 0, reason: "слишком мало отсчётов" };
  }
  // Скользящая база: среднее по отсчётам в окне ±PPG_BASELINE_MS/2.
  var half = PPG_BASELINE_MS / 2;
  var ac = new Array(n);
  var j0 = 0, j1 = 0, sum = 0, cnt = 0;
  for (var i = 0; i < n; i++) {
    while (j1 < n && samples[j1].t <= samples[i].t + half) { sum += samples[j1].v; cnt++; j1++; }
    while (j0 < n && samples[j0].t < samples[i].t - half) { sum -= samples[j0].v; cnt--; j0++; }
    ac[i] = { t: samples[i].t, v: samples[i].v - sum / cnt };
  }
  // Шумовой пол: медиана |Δv| соседних отсчётов.
  var diffs = [];
  for (var i = 1; i < n; i++) { diffs.push(Math.abs(ac[i].v - ac[i - 1].v)); }
  diffs.sort(function (a, b) { return a - b; });
  var noise = diffs[Math.floor(diffs.length / 2)] || 0.001;
  // Эпохи по времени.
  var t0 = samples[0].t, tEnd = samples[n - 1].t;
  var epochs = [];
  for (var e = t0; e < tEnd; e += PPG_EPOCH_MS) { epochs.push({ from: e, to: e + PPG_EPOCH_MS }); }
  var rr = [];
  var rejected = 0;
  for (var k = 0; k < epochs.length; k++) {
    var ep = epochs[k];
    var idx = [];
    for (var i = 0; i < n; i++) { if (ac[i].t >= ep.from && ac[i].t < ep.to) { idx.push(i); } }
    if (idx.length < 10) { rejected++; continue; }
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < idx.length; i++) {
      var v = ac[idx[i]].v;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    var ampl = hi - lo;
    if (ampl < PPG_AMPL_NOISE_X * noise) { rejected++; continue; }
    var thr = lo + 0.6 * ampl;
    var peaks = [];
    var lastPeakT = -Infinity;
    for (var i = 1; i < idx.length - 1; i++) {
      var t = ac[idx[i]].t, v = ac[idx[i]].v;
      if (v > thr && v >= ac[idx[i - 1]].v && v >= ac[idx[i + 1]].v && t - lastPeakT >= PPG_REFRACTORY_MS) {
        peaks.push(t); lastPeakT = t;
      }
    }
    if (peaks.length < 5) { rejected++; continue; }
    var okEpoch = true;
    var epRR = [];
    for (var i = 1; i < peaks.length; i++) {
      var d = peaks[i] - peaks[i - 1];
      if (d < PPG_RR_MIN || d > PPG_RR_MAX) { okEpoch = false; break; }
      epRR.push(d);
    }
    if (!okEpoch) { rejected++; continue; }
    var mean = epRR.reduce(function (a, b) { return a + b; }, 0) / epRR.length;
    var vari = epRR.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / epRR.length;
    var cv = Math.sqrt(vari) / mean;
    if (cv > PPG_CV_MAX) { rejected++; continue; }
    for (var i = 0; i < epRR.length; i++) { rr.push(epRR[i]); }
  }
  var epochsTotal = epochs.length;
  return { rr: rr, epochsTotal: epochsTotal, epochsRejected: rejected, reason: "" };
}

// Громкий отказ сборки RR: возвращает строку отказа или пустую строку.
function ppgQualityRefusal(ex) {
  if (ex.epochsTotal < 2) { return "брак: запись короче двух эпох (" + ex.epochsTotal + ")"; }
  var share = ex.epochsRejected / ex.epochsTotal;
  if (share > 0.5) { return "брак: отбраковано эпох " + ex.epochsRejected + " из " + ex.epochsTotal + " — сигнала пульса нет"; }
  if (ex.rr.length < 8) { return "брак: восстановлено RR " + ex.rr.length + " (< 8)"; }
  return "";
}
// PpgEngine-END

// ── Протокол перебора (Н2-06) ───────────────────────────────────────────
// SweepEngine-START (маркер скрипт-проверки: сборка RR-сегментов)
// Каждому шагу пейсера — свой RR-сегмент: камера пишет пульс на протяжении
// шага (инвариант 7: кадры умирают в canvas, наружу идёт только итоговый
// RR), на финише сегмент проходит QC движка Н2-05 и попадает в отметку
// {step, tempo_bpm, rr, rr_reason}. Сервер считает спектры билтинами
// Ломба–Скаргла (№591), фиксирует резонанс в sweep_result и kv; анализ
// запускается только финальным закрытием сессии (final=1).
var stepSamples = [];
var stepPpgOn = false;   // семплирование текущего шага идёт

function sweepStepStart() {
  ppgStart_ = performance.now();
  stepSamples = [];
  if (ppgStream) { stepPpgOn = true; stepSampleFrame(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status("Камера недоступна: нужен защищённый контекст (https) — шаг пойдёт без пульса", "err");
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 }, audio: false })
    .then(function (stream) {
      ppgStream = stream;
      var video = document.getElementById("ppg-video");
      video.srcObject = stream;
      video.play();
      stepPpgOn = true;
      stepSampleFrame();
    })
    .catch(function (e) { status("Камера отказала громко: " + e.name + " — шаг пойдёт без пульса", "err"); });
}

function stepSampleFrame() {
  if (!stepPpgOn) { return; }
  var video = document.getElementById("ppg-video");
  if (video.videoWidth > 0) {
    ppgCtx.drawImage(video, 8, 8, 16, 16, 0, 0, 8, 8);
    var d = ppgCtx.getImageData(0, 0, 8, 8).data;
    var sum = 0;
    for (var i = 0; i < d.length; i += 4) { sum += d[i + 1]; }
    stepSamples.push({ t: performance.now() - ppgStart_, v: sum / (d.length / 4) });
  }
  requestAnimationFrame(stepSampleFrame);
}

function stepMark() {
  // Отметка шага: RR-сегмент (если пульс писался) едет в отметке; брак
  // едет громко в rr_reason — протокол продолжается, сервер считает
  // шаг негодным. Поле rr присутствует ВСЕГДА — сервер отличает отметку
  // Н2-06 от старого формата по наличию ключа.
  var rec = { step: stepNo, tempo_bpm: tempo, rr: [], rr_reason: "" };
  if (stepPpgOn) {
    stepPpgOn = false;
    var ex = ppgExtractRR(stepSamples);
    var refusal = ppgQualityRefusal(ex);
    if (refusal !== "") { rec.rr_reason = refusal; }
    else { rec.rr = ex.rr; }
    stepSamples = [];
  }
  return rec;
}

function sweepStopCam() {
  // Камера протокола гасится вместе с сессией; если вкладка «Пульс»
  // сейчас ведёт свою запись — её стрим не трогаем.
  if (ppgStream && !ppgSampling) {
    var tracks = ppgStream.getTracks();
    for (var i = 0; i < tracks.length; i++) { tracks[i].stop(); }
    ppgStream = null;
  }
}
// SweepEngine-END

var rrBuffer = [];
var ppgStream = null;
var ppgSampling = false;
var ppgStart_ = 0;
var ppgCanvas = document.createElement("canvas");
ppgCanvas.width = 32; ppgCanvas.height = 32;
var ppgCtx = ppgCanvas.getContext("2d", { willReadFrequently: true });
var ppgSamples = [];

function ppgStart() {
  if (ppgSampling) { return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status("Камера недоступна: нужен защищённый контекст (https) — канал ADR-0002 (а) его даёт, http-закладка нет", "err");
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 }, audio: false })
    .then(function (stream) {
      ppgStream = stream;
      var video = document.getElementById("ppg-video");
      video.srcObject = stream;
      video.play();
      ppgSamples = [];
      rrBuffer = [];
      ppgSampling = true;
      ppgStart_ = performance.now();
      document.getElementById("ppg-start-btn").disabled = true;
      document.getElementById("ppg-stop-btn").disabled = false;
      document.getElementById("ppg-save-btn").disabled = true;
      document.getElementById("ppg-summary").textContent = "";
      ppgSampleFrame();
    })
    .catch(function (e) { status("Камера отказала громко: " + e.name, "err"); });
}

function ppgSampleFrame() {
  if (!ppgSampling) { return; }
  var video = document.getElementById("ppg-video");
  if (video.videoWidth > 0) {
    // Центральная область кадра — средний зелёный канал (самый
    // пульсативный). Кадр умирает в canvas: ни копий, ни передачи.
    ppgCtx.drawImage(video, 8, 8, 16, 16, 0, 0, 8, 8);
    var d = ppgCtx.getImageData(0, 0, 8, 8).data;
    var sum = 0;
    for (var i = 0; i < d.length; i += 4) { sum += d[i + 1]; }
    ppgSamples.push({ t: performance.now() - ppgStart_, v: sum / (d.length / 4) });
  }
  var el = Math.round((performance.now() - ppgStart_) / 1000);
  document.getElementById("ppg-timer").textContent = "Запись: " + el + " с (отсчётов " + ppgSamples.length + ")";
  requestAnimationFrame(ppgSampleFrame);
}

function ppgStop() {
  if (!ppgSampling) { return; }
  ppgSampling = false;
  if (ppgStream) {
    var tracks = ppgStream.getTracks();
    for (var i = 0; i < tracks.length; i++) { tracks[i].stop(); }
    ppgStream = null;
  }
  document.getElementById("ppg-start-btn").disabled = false;
  document.getElementById("ppg-stop-btn").disabled = true;
  var ex = ppgExtractRR(ppgSamples);
  var refusal = ppgQualityRefusal(ex);
  if (refusal !== "") {
    status(refusal + " — запись НЕ сохранена, повторите с хорошим сигналом", "err");
    document.getElementById("ppg-summary").textContent = "Эпох: " + ex.epochsTotal + ", отбраковано: " + ex.epochsRejected;
    return;
  }
  rrBuffer = ex.rr;
  var mean = ex.rr.reduce(function (a, b) { return a + b; }, 0) / ex.rr.length;
  document.getElementById("ppg-save-btn").disabled = false;
  document.getElementById("ppg-summary").textContent =
    "RR: " + ex.rr.length + " · средний " + Math.round(mean) + " мс (" + Math.round(60000 / mean) + " уд/мин) · эпохи: " +
    (ex.epochsTotal - ex.epochsRejected) + "/" + ex.epochsTotal + " годных";
  status("Сигнал годен — сохраните в сессию или перепишите", "ok");
}

function ppgSave() {
  if (!sessionId) { status("Сначала начните сессию (это отдельная сессия PPG)", "err"); return; }
  if (!rrBuffer.length) { status("RR-ряда нет — сначала запишите сигнал", "err"); return; }
  api("/miniapp/session/close", {
    id: String(sessionId),
    steps_done: String(marks.length),
    step_marks: JSON.stringify(marks),
    rr_json: JSON.stringify(rrBuffer),
    rr_source: "ppg"
  })
    .then(function (res) {
      if (res.code === 403 && res.body.indexOf("CSRF") >= 0) { location.reload(); return; }
      if (res.code !== 200) { status("Отказ сервера: " + res.code + " " + res.body, "err"); return; }
      status("RR-ряд (" + rrBuffer.length + " интервалов) записан в сессию " + sessionId, "ok");
    })
    .catch(function (e) { status("Ошибка сети: " + e, "err"); });
}
</script>
